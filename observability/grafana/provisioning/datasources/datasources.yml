apiVersion: 1

datasources:
  - name: Aegis Metrics
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Aegis Logs
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
  - name: Aegis Traces
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
